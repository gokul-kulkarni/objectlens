<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ObjectLens — explore, compare and read structured data</title>
    <meta name="description" content="Explore Python repr() output, JSON or YAML as a tree or graph, compare two objects in any formats, and read READMEs with Mermaid diagrams. Runs entirely in your browser." />
    <!--
      Icons are real files in public/, not an inline data: URI. Link previews (WhatsApp, LinkedIn,
      Slack, iMessage) fetch icons and images by URL and cannot use one embedded in the page.
      Paths are relative so the same build also works when served from 127.0.0.1.
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f172a" />

    <!--
      Link previews. These URLs must be absolute — preview crawlers do not resolve relative ones —
      so they name the public site even in a local build.
    -->
    <link rel="canonical" href="https://objectlens.gokulkulkarni.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ObjectLens" />
    <meta property="og:title" content="ObjectLens — explore, compare and read structured data" />
    <meta property="og:description" content="JSON, YAML and Python repr() as a tree or graph, side-by-side comparison in any formats, and READMEs with Mermaid diagrams — all in your browser." />
    <meta property="og:url" content="https://objectlens.gokulkulkarni.dev/" />
    <meta property="og:image" content="https://objectlens.gokulkulkarni.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ObjectLens comparing two JSON configs, with added, removed and changed values marked" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

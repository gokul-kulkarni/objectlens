# Keeps the committed Orca plugin build honest.
#
# Orca installs a plugin by copying the files of a tagged commit, so `apps/orca-plugin/dist` is
# committed rather than built on install. That makes it easy to change the UI and forget to
# rebuild: the site would ship the change and the plugin would not. This rebuilds from source and
# fails if the result differs from what is committed — which is also what lets the directory's
# rule hold, that bundled output is fine only when its source is in the same repository.
name: Orca plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      # Orca's directory refuses to list a release that contains binary files, and it judges a
      # file binary by its bytes: one raw NUL in a test fixture was enough. Images and web fonts
      # are allowed; anything else must be plain text with no control characters but whitespace.
      - name: No binary files in the repository
        run: |
          python3 - <<'PY'
          import subprocess, sys
          allowed = ('.png', '.jpg', '.jpeg', '.webp', '.gif', '.woff', '.woff2')
          names = subprocess.run(['git', 'ls-files', '-z'], capture_output=True, check=True).stdout.decode().split('\0')
          bad = []
          for name in filter(None, names):
              if name.lower().endswith(allowed):
                  continue
              data = open(name, 'rb').read()
              if any((c < 0x20 and c not in (9, 10, 13)) or c == 0x7f for c in data):
                  bad.append(name)
          for name in bad:
              print(f'::error file={name}::contains control characters; Orca treats it as binary. Use escapes such as \\x00 instead.')
          sys.exit(1 if bad else 0)
          PY

      - name: Install
        run: bun install --frozen-lockfile

      - name: Rebuild the plugin
        run: bun run build:orca

      - name: Committed build matches source
        run: |
          if ! git diff --exit-code --stat -- apps/orca-plugin/dist || [ -n "$(git status --porcelain -- apps/orca-plugin/dist)" ]; then
            echo "::error::apps/orca-plugin/dist is out of date. Run 'bun run build:orca' and commit the result."
            git status --porcelain -- apps/orca-plugin/dist
            exit 1
          fi
